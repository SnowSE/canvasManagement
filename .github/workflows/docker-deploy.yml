name: Deploy to Docker Hub

# Version 5 (the pane layout) is published from this branch on every push,
# as main publishes version 4: people switch when they're ready, by changing
# the image tag in their docker-compose.yml. "latest" stays with main.
on:
  push:
    branches: [ v5 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      env:
        GIT_SHA: ${{ github.sha }}
        PUSH_LATEST: "false"
      run: |
        chmod +x ./build.sh
        ./build.sh -t -p